[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "it-ticket-triage"
version = "0.1.0"
description = "On-device IT ticket triage: a fine-tuned MiniLM predicts category and ITIL priority, exported to ONNX (FP32/INT8/W8A16), with a FastAPI dashboard, metrics and confusion matrices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesús Aragón" }]
requires-python = ">=3.11"
keywords = ["nlp", "text-classification", "itsm", "helpdesk", "onnx", "transformers", "on-device-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.18"]
qnn = ["onnxruntime-qnn>=1.18"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
train = ["torch>=2.2", "transformers>=4.40", "onnx>=1.15", "onnxscript>=0.1", "scikit-learn>=1.3", "sympy>=1.12"]
dev = [
  "onnxruntime>=1.18",
  "onnx>=1.15",
  "scikit-learn>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
triage = "ticket_triage.cli:main"

[project.urls]
Homepage = "https://github.com/RobiiAragon/it-ticket-triage"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_triage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
